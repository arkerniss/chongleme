[versions]
# 版本矩阵与本项目所依赖的 AndroidLiquidGlass 仓库保持一致：
#   AGP 9.3.2 / Gradle 9.7.1 / Kotlin 2.4.10 / Compose Multiplatform 1.12.0
agp = "9.3.2"
kotlin = "2.4.10"
compose = "1.12.0"

activity = "1.13.0"
core = "1.19.1"
lifecycle = "2.9.4"
coil = "3.6.3"

# 玻璃效果本体（Kyant0/AndroidLiquidGlass，Apache-2.0）
backdrop = "2.0.1"
kyantShapes = "1.2.1"

junit = "4.13.2"
desugarJdkLibs = "2.1.5"
sqliteJdbc = "3.50.3.0"
orgJson = "20260814"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# backdrop 是 Compose Multiplatform 库，依赖坐标是 org.jetbrains.compose.*
# 这些坐标与 AndroidX Compose 同源，由 Gradle 元数据自动解析到 android 变体。
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-graphics = { group = "org.jetbrains.compose.ui", name = "ui-graphics", version.ref = "compose" }
compose-material-ripple = { group = "org.jetbrains.compose.material", name = "material-ripple", version.ref = "compose" }

backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
kyant-shapes = { group = "io.github.kyant0", name = "shapes", version.ref = "kyantShapes" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
